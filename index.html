<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Amazon Kostenkalkulation – KU / DDP korrekt</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#f6f8fc; --card:#fff; --primary:#2563eb;
  --bad:#dc2626; --mid:#d97706; --good:#16a34a;
  --muted:#64748b; --border:#e5e7eb;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:var(--bg)}
header{background:#1e40af;color:#fff;padding:20px;text-align:center}
main{max-width:1100px;margin:auto;padding:16px}
.section{background:#fff;border-radius:14px;margin-bottom:16px;
  box-shadow:0 10px 25px rgba(0,0,0,.06)}
.section-header{display:flex;justify-content:space-between;
  padding:14px 16px;cursor:pointer}
.section-content{padding:16px;border-top:1px solid var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
label{font-size:12px;color:var(--muted);font-weight:600}
input{width:100%;padding:8px;border-radius:10px;border:1px solid var(--border)}
button{border:none;border-radius:12px;padding:10px;font-weight:600;
  background:#2563eb;color:#fff;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:8px;border-bottom:1px solid var(--border);text-align:center}
.bad{color:var(--bad);font-weight:700}
.mid{color:var(--mid);font-weight:700}
.good{color:var(--good);font-weight:700}
.break-box{margin-top:6px;padding:6px;border:1px dashed var(--border);
  border-radius:8px;font-size:13px}
</style>
</head>

<body>

<header>
<h1>Amazon Kostenkalkulation</h1>
<p>Kleinunternehmer · DDP korrekt · Sets</p>
</header>

<main>

<div class="section">
<div class="section-header" onclick="toggle(this)">
<h2>Einkauf & DDP</h2><span>▼</span>
</div>
<div class="section-content grid">
  <div><label>EK Warenwert (€)</label><input id="ek" value="4"></div>
  <div><label>Gewicht (kg)</label><input id="gewicht" value="0.5"></div>
  <div><label>L (cm)</label><input id="l" value="32"></div>
  <div><label>B (cm)</label><input id="b" value="23"></div>
  <div><label>H (cm)</label><input id="h" value="4"></div>
  <div><label>DDP €/kg (inkl. MwSt)</label><input id="preisKg" value="6.5"></div>
  <div><label>DDP gesamt (€)</label><input id="ddp" readonly></div>
</div>
</div>

<div class="section">
<div class="section-header" onclick="toggle(this)">
<h2>Amazon & Kosten</h2><span>▶</span>
</div>
<div class="section-content grid" style="display:none">
  <div><label>Amazon %</label><input id="amazP" value="15"></div>
  <div><label>Amazon Fix (€)</label><input id="amazFix" value="0.99"></div>
  <div><label>Versand (€)</label><input id="versand" value="5.5"></div>
  <div><label>Verpackung (€)</label><input id="verpackung" value="1"></div>
  <div><label>Retourquote (%)</label><input id="retour" value="5"></div>
  <div><label>Zielmarge (%)</label><input id="ziel" value="25"></div>
</div>
</div>

<div class="section">
<div class="section-header" onclick="toggle(this)">
<h2>Verkaufspreise</h2><span>▶</span>
</div>
<div class="section-content grid" style="display:none">
  <div><label>1er (€)</label><input id="p1" value="29.99"></div>
  <div><label>2er (€)</label><input id="p2" value="44.99"></div>
</div>
</div>

<div class="section">
<div class="section-header">
<h2>Ergebnis</h2>
</div>
<div class="section-content">
<button onclick="calc()">Berechnen</button>
<div id="out"></div>
</div>
</div>

</main>

<script>
function toggle(h){
  const c=h.nextElementSibling;
  c.style.display=c.style.display==="none"?"block":"none";
}

function ampel(m){
  if(m<20)return"bad";
  if(m<25)return"mid";
  return"good";
}

function calc(){
  const ek=+ekInput();
  const g=+gewicht.value;
  const vol=(+l.value*+b.value*+h.value)/6000;
  const abrechnung=Math.max(g,vol);

  // DDP ist bereits inkl. MwSt
  const ddpW=abrechnung*(+preisKg.value);
  ddp.value=ddpW.toFixed(2);

  // Amazon Gebühr KU (15 % + 19 % MwSt)
  const amaz=(+amazP.value/100)*1.19;
  const amazFixW=+amazFix.value;
  const vers=+versand.value;
  const verp=+verpackung.value;
  const ret=+retour.value/100;
  const ziel=+ziel.value/100;

  const fix=amazFixW+vers+verp;

  const sets=[
    {n:1,p:+p1.value},
    {n:2,p:+p2.value}
  ];

  let rows="";
  sets.forEach(s=>{
    const kosten=(ek+ddpW)*s.n+fix;
    const geb=s.p*amaz;
    const ges=kosten+geb+(s.p*ret);
    const gew=s.p-ges;
    const marge=(gew/s.p)*100;
    const be=kosten/(1-amaz-ret);

    rows+=`
    <tr>
      <td>${s.n}er</td>
      <td>${s.p.toFixed(2)} €</td>
      <td>${gew.toFixed(2)} €</td>
      <td class="${ampel(marge)}">${marge.toFixed(1)} %</td>
      <td>${be.toFixed(2)} €</td>
    </tr>`;
  });

  out.innerHTML=`
  <table>
    <tr><th>Set</th><th>VK</th><th>Gewinn</th><th>Marge</th><th>Break-even</th></tr>
    ${rows}
  </table>`;
}

function ekInput(){return +document.getElementById("ek").value||0}
</script>

</body>
</html>
